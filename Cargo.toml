[package]
name = "servicenow-cli"
version = "0.3.8"
edition = "2024"
rust-version = "1.90"
description = "Fast, safe, human-friendly ServiceNow operations from the terminal"
homepage = "https://github.com/rvben/servicenow-cli"
repository = "https://github.com/rvben/servicenow-cli"
documentation = "https://docs.rs/servicenow-cli"
license = "MIT"
keywords = ["servicenow", "cli", "incidents", "itsm"]
categories = ["command-line-utilities"]
readme = "README.md"

[[bin]]
name = "servicenow"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
comfy-table = "8"
csv = "1"
dialoguer = { version = "0.12", features = ["fuzzy-select"] }
dirs = "6"
futures-util = "0.3"
keyring = "4.1"
mime_guess = "2"
oauth2 = { version = "5", default-features = false, features = ["reqwest"] }
open = "5.4"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query", "form", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "1.1"
similar = "3.1"
tempfile = "3"
terminal_size = "0.4"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "time"] }
tokio-tungstenite = "0.30"
tokio-util = { version = "0.7", features = ["io"] }
toml = "1.1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
wiremock = "0.6"
