[package]
name = "servicenow-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Unofficial agent-friendly CLI for ServiceNow"
license = "MIT"
keywords = ["servicenow", "cli", "incidents", "itsm"]
categories = ["command-line-utilities"]
readme = "README.md"

[[bin]]
name = "servicenow"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
dirs = "6"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = "1.1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
wiremock = "0.6"
