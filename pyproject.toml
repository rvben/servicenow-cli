[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "servicenow-cli"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]
description = "Fast, safe, human-friendly ServiceNow operations from the terminal"
readme = "README.md"
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/rvben/servicenow-cli"
Repository = "https://github.com/rvben/servicenow-cli"
Issues = "https://github.com/rvben/servicenow-cli/issues"

[tool.maturin]
bindings = "bin"
strip = true
